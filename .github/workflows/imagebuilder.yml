name: Imagebuilder CI

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt version'
        required: true
        default: '22.03.7'

      target:
        description: 'Target'
        required: true
        default: 'ramips'

      subtarget:
        description: 'Subtarget'
        required: true
        default: 'mt7620'

      profile:
        description: 'Device profile'
        required: true
        default: 'zbtlink_zbt-wr8305rt'


jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BASE_PACKAGES: >
        kmod-usb-core
        kmod-usb2
        kmod-usb-storage
        kmod-scsi-core
        kmod-fs-ext4
        block-mount
        e2fsprogs
        e2fsprogs-extra


    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          wget \
          xz-utils \
          tar \
          ca-certificates


    - name: Check files directory
      run: |
        echo "Checking custom files..."

        if [ -f files/etc/config/fstab ]; then
          echo "OK: fstab found"
        else
          echo "ERROR: files/etc/config/fstab missing"
          exit 1
        fi


        if [ -f files/etc/uci-defaults/99-extroot ]; then
          echo "OK: 99-extroot found"
        else
          echo "WARNING: 99-extroot missing"
        fi


        echo "Files tree:"
        find files -type f


    - name: Download ImageBuilder
      run: |
        set -e

        VERSION="${{ inputs.openwrt_version }}"
        TARGET="${{ inputs.target }}"
        SUBTARGET="${{ inputs.subtarget }}"

        IB_NAME="openwrt-imagebuilder-${VERSION}-${TARGET}-${SUBTARGET}.Linux-x86_64.tar.xz"

        URL="https://downloads.openwrt.org/releases/${VERSION}/targets/${TARGET}/${SUBTARGET}/${IB_NAME}"

        echo "Downloading:"
        echo "$URL"


        wget -nv -O "$IB_NAME" "$URL"


        tar -xJf "$IB_NAME"


        IB_DIR=$(find . -maxdepth 1 \
          -type d \
          -name "openwrt-imagebuilder-*" \
          -print -quit)


        if [ -z "$IB_DIR" ]; then
          echo "ImageBuilder not found"
          exit 1
        fi


        echo "IB_DIR=$IB_DIR" >> $GITHUB_ENV



    - name="Build firmware"
      run: |
        set -e

        cd "$IB_DIR"


        echo "Checking profile..."

        make info | grep -i zbt || true


        echo "Building..."

        make image \
          PROFILE="${{ inputs.profile }}" \
          PACKAGES="$BASE_PACKAGES" \
          FILES="../files"


    - name="Collect firmware"
      run: |
        mkdir -p out

        cp -r \
        "$IB_DIR/bin/targets/"*/* \
        out/


        echo "Firmware files:"
        ls -lh out



    - name="Upload firmware"
      uses: actions/upload-artifact@v4
      with:
        name: WR8305RT-OpenWrt-extroot
        path: out/
