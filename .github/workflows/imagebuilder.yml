name: Imagebuilder CI

on:
  workflow_dispatch:
    inputs:

      openwrt_version:
        description: 'OpenWrt version'
        required: true
        default: '22.03.5'

      target:
        description: 'Target'
        required: true
        default: 'ramips'

      subtarget:
        description: 'Subtarget'
        required: true
        default: 'mt7620'

      profile:
        description: 'Device profile'
        required: true
        default: 'zbtlink_zbt-wr8305rt'


jobs:

  build:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout
        uses: actions/checkout@v4



      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y wget tar xz-utils



      - name: Set variables
        run: |

          echo "OPENWRT_VERSION=${{ github.event.inputs.openwrt_version }}" >> $GITHUB_ENV
          echo "TARGET=${{ github.event.inputs.target }}" >> $GITHUB_ENV
          echo "SUBTARGET=${{ github.event.inputs.subtarget }}" >> $GITHUB_ENV
          echo "PROFILE=${{ github.event.inputs.profile }}" >> $GITHUB_ENV



      - name: Check files
        run: |

          if [ ! -f files/etc/uci-defaults/99-extroot ]; then
              echo "Missing extroot script"
              exit 1
          fi

          chmod +x files/etc/uci-defaults/99-extroot

          ls -l files/etc/uci-defaults/



      - name: Download ImageBuilder
        run: |

          IB_NAME="openwrt-imagebuilder-${OPENWRT_VERSION}-${TARGET}-${SUBTARGET}.Linux-x86_64.tar.xz"

          URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}/${IB_NAME}"


          echo "$URL"

          wget -O "$IB_NAME" "$URL"


          tar -xJf "$IB_NAME"



      - name: Find ImageBuilder
        run: |

          IB_DIR=$(find . \
          -maxdepth 1 \
          -type d \
          -name "openwrt-imagebuilder-*" \
          | head -n1)


          if [ -z "$IB_DIR" ]; then
              echo "ImageBuilder not found"
              exit 1
          fi


          echo "IB_DIR=$IB_DIR" >> $GITHUB_ENV


          echo "ImageBuilder:"
          echo "$IB_DIR"



      - name: Check profile
        run: |

          cd "$IB_DIR"

          make info | grep -A10 zbt



      - name: Build firmware
        run: |

          cd "$IB_DIR"


          PACKAGES="luci luci-ssl \
          kmod-usb-core \
          kmod-usb2 \
          kmod-usb-storage \
          kmod-scsi-core \
          kmod-fs-ext4 \
          kmod-fs-vfat \
          block-mount \
          mount-utils \
          bash \
          curl \
          ca-bundle \
          wget-ssl \
          unzip \
          tar \
          ipset \
          iptables-mod-tproxy \
          kmod-tun"


          make image \
            PROFILE="${PROFILE}" \
            PACKAGES="${PACKAGES}" \
            FILES="../files"



      - name: Check generated files
        run: |

          echo "========== BIN LIST =========="

          find "$IB_DIR" \
          -type f \
          \( -name "*.bin" -o -name "*.img" \) \
          -ls || true


          echo "========== TARGET DIR =========="

          ls -lh "$IB_DIR/bin/targets/" || true



      - name: Collect firmware
        run: |

          mkdir -p output


          FILE=$(find "$IB_DIR" \
          -type f \
          -name "*.bin" \
          | head -n1)


          if [ -z "$FILE" ]; then

              echo "没有找到固件文件"

              exit 1

          fi


          echo "复制固件:"
          echo "$FILE"


          cp "$FILE" output/


          sha256sum output/* > output/sha256sums.txt


          ls -lh output



      - name: Upload firmware
        uses: actions/upload-artifact@v4

        with:

          name: WR8305RT-OpenWrt-22.03.7

          path: output/
