name: Imagebuilder CI

on:
  workflow_dispatch:
    inputs:

      openwrt_version:
        description: 'OpenWrt version'
        required: true
        default: '22.03.7'

      target:
        description: 'Target'
        required: true
        default: 'ramips'

      subtarget:
        description: 'Subtarget'
        required: true
        default: 'mt7620'

      profile:
        description: 'Device profile'
        required: true
        default: 'zbtlink_zbt-wr8305rt'


jobs:

  build:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout
        uses: actions/checkout@v4



      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y wget tar xz-utils



      - name: Set variables
        run: |

          echo "OPENWRT_VERSION=${{ github.event.inputs.openwrt_version }}" >> $GITHUB_ENV
          echo "TARGET=${{ github.event.inputs.target }}" >> $GITHUB_ENV
          echo "SUBTARGET=${{ github.event.inputs.subtarget }}" >> $GITHUB_ENV
          echo "PROFILE=${{ github.event.inputs.profile }}" >> $GITHUB_ENV



      - name: Check extroot file
        run: |

          if [ ! -f files/etc/uci-defaults/99-extroot ]; then
            echo "99-extroot missing"
            exit 1
          fi

          chmod +x files/etc/uci-defaults/99-extroot

          ls -l files/etc/uci-defaults/



      - name: Download ImageBuilder
        run: |

          IB_NAME="openwrt-imagebuilder-${OPENWRT_VERSION}-${TARGET}-${SUBTARGET}.Linux-x86_64.tar.xz"

          URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}/${IB_NAME}"


          echo "Download:"
          echo "$URL"


          wget -O "$IB_NAME" "$URL"


          tar -xJf "$IB_NAME"



      - name: Find ImageBuilder
        run: |

          IB_DIR=$(find . \
          -maxdepth 1 \
          -type d \
          -name "openwrt-imagebuilder-*" \
          | head -n1)


          if [ -z "$IB_DIR" ]; then
            echo "ImageBuilder not found"
            exit 1
          fi


          echo "IB_DIR=$IB_DIR" >> $GITHUB_ENV


          echo "Using:"
          echo "$IB_DIR"



      - name: Check profile
        run: |

          cd "$IB_DIR"

          make info | grep -A5 zbt



      - name: Build firmware
        run: |

          cd "$IB_DIR"


          PACKAGES="luci luci-ssl \
          kmod-usb-core \
          kmod-usb2 \
          kmod-usb-storage \
          kmod-scsi-core \
          kmod-fs-ext4 \
          kmod-fs-vfat \
          block-mount \
          mount-utils \
          bash \
          curl \
          ca-bundle \
          wget-ssl \
          unzip \
          tar \
          ipset \
          iptables-mod-tproxy \
          kmod-tun"


          make image \
            PROFILE="${PROFILE}" \
            PACKAGES="${PACKAGES}" \
            FILES="../files"



      - name: Find firmware
        run: |

          echo "Searching firmware..."

          find "$IB_DIR/bin" -name "*.bin"



      - name: Collect firmware
        run: |

          mkdir -p output


          SYSUPGRADE=$(find "$IB_DIR/bin" \
          -name "*sysupgrade.bin" \
          | head -n1)


          if [ -z "$SYSUPGRADE" ]; then

            echo "No sysupgrade firmware found"

            exit 1

          fi


          cp -v "$SYSUPGRADE" output/


          FACTORY=$(find "$IB_DIR/bin" \
          -name "*factory.bin" \
          | head -n1)


          if [ ! -z "$FACTORY" ]; then

            cp -v "$FACTORY" output/

          fi



          sha256sum output/*.bin > output/sha256sums.txt


          ls -lh output



      - name: Upload firmware
        uses: actions/upload-artifact@v4

        with:

          name: WR8305RT-OpenWrt-22.03.7

          path: output/
