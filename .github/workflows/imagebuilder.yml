name: Imagebuilder CI

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout
        uses: actions/checkout@v4


      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y wget tar xz-utils


      - name: Set variables
        run: |

          echo "OPENWRT_VERSION=22.03.5" >> $GITHUB_ENV
          echo "TARGET=ramips" >> $GITHUB_ENV
          echo "SUBTARGET=mt7620" >> $GITHUB_ENV
          echo "PROFILE=zbtlink_zbt-wr8305rt" >> $GITHUB_ENV



      - name: Check extroot
        run: |

          if [ ! -f files/etc/uci-defaults/99-extroot ]; then

            echo "缺少99-extroot"

            exit 1

          fi


          chmod +x files/etc/uci-defaults/99-extroot



      - name: Download ImageBuilder
        run: |

          IB_NAME="openwrt-imagebuilder-${OPENWRT_VERSION}-${TARGET}-${SUBTARGET}.Linux-x86_64.tar.xz"


          URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}/${IB_NAME}"


          echo "下载:"
          echo "$URL"


          wget -O "$IB_NAME" "$URL"


          tar -xJf "$IB_NAME"



      - name: Find ImageBuilder
        run: |

          IB_DIR=$(find . \
          -maxdepth 1 \
          -type d \
          -name "openwrt-imagebuilder-*" \
          | head -n1)


          if [ -z "$IB_DIR" ]; then

            echo "找不到ImageBuilder"

            exit 1

          fi


          echo "IB_DIR=$IB_DIR" >> $GITHUB_ENV



      - name: Check profile
        run: |

          cd "$IB_DIR"


          echo "设备列表:"
          make info | grep -i zbt



      - name: Build firmware
        run: |

          cd "$IB_DIR"


          # 先用精简配置确认能生成固件

          PACKAGES="luci luci-ssl \
          kmod-usb-core \
          kmod-usb2 \
          kmod-usb-storage \
          kmod-scsi-core \
          kmod-fs-ext4 \
          kmod-fs-vfat \
          block-mount \
          mount-utils"


          echo "开始编译..."

          make image \
          PROFILE="${PROFILE}" \
          PACKAGES="${PACKAGES}" \
          FILES="../files" \
          V=s



      - name: Debug result
        if: always()
        run: |

          echo "======== 查看bin目录 ========"

          ls -R "$IB_DIR/bin" || true


          echo "======== 查找固件 ========"

          find "$IB_DIR" \
          -type f \
          \( \
          -name "*sysupgrade.bin" \
          -o \
          -name "*factory.bin" \
          \) \
          -ls || true



      - name: Collect firmware
        run: |

          mkdir -p output


          FIRMWARE=$(find "$IB_DIR/bin/targets" \
          -type f \
          \( \
          -name "*sysupgrade.bin" \
          -o \
          -name "*factory.bin" \
          \) \
          | head -n1)


          if [ -z "$FIRMWARE" ]; then

            echo "没有生成固件"

            exit 1

          fi


          echo "找到固件:"
          echo "$FIRMWARE"


          cp "$FIRMWARE" output/


          sha256sum output/*.bin > output/sha256sums.txt


          ls -lh output



      - name: Upload firmware
        uses: actions/upload-artifact@v4

        with:

          name: WR8305RT-openwrt-22.03.5

          path: output/
