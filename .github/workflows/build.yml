name: Build OpenWrt Image (ImageBuilder)

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本 (例如 22.03.5)'
        required: true
        default: '22.03.5'
      target:
        description: 'Target (例如 ramips)'
        required: true
        default: 'ramips'
      subtarget:
        description: 'Subtarget (例如 rt305x 或 mt7621)'
        required: true
        default: 'mt7620'
      profile:
        description: 'Target profile (设备型号 profile，必须精确)'
        required: true
        default: 'zbtlink_wr8305rt'
      packages:
        description: '要包含的包（以空格分隔）'
        required: false
        default: 'kmod-usb-core kmod-usb2 kmod-usb-storage kmod-scsi-core kmod-fs-ext4 kmod-fs-vfat block-mount mount-utils'
      create_release:
        description: '是否在成功时创建 GitHub Release (true/false)'
        required: false
        default: 'false'
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OUTDIR: out
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils wget tar ca-certificates

      - name: Set variables (with defaults)
        run: |
          OPENWRT_VERSION="${{ github.event.inputs.openwrt_version }}"
          TARGET="${{ github.event.inputs.target }}"
          SUBTARGET="${{ github.event.inputs.subtarget }}"
          PROFILE="${{ github.event.inputs.profile }}"
          PACKAGES_INPUT="${{ github.event.inputs.packages }}"
          CREATE_RELEASE_INPUT="${{ github.event.inputs.create_release }}"

          if [ -z "$OPENWRT_VERSION" ]; then OPENWRT_VERSION="22.03.5"; fi
          if [ -z "$TARGET" ]; then TARGET="ramips"; fi
          if [ -z "$SUBTARGET" ]; then SUBTARGET="mt7620"; fi
          if [ -z "$PROFILE" ]; then PROFILE="zbtlink_wr8305rt"; fi
          if [ -z "$PACKAGES_INPUT" ]; then PACKAGES_INPUT='kmod-usb-core kmod-usb2 kmod-usb-storage kmod-scsi-core kmod-fs-ext4 kmod-fs-vfat block-mount mount-utils'; fi
          if [ -z "$CREATE_RELEASE_INPUT" ]; then CREATE_RELEASE_INPUT='false'; fi

          echo "OPENWRT_VERSION=$OPENWRT_VERSION" >> $GITHUB_ENV
          echo "TARGET=$TARGET" >> $GITHUB_ENV
          echo "SUBTARGET=$SUBTARGET" >> $GITHUB_ENV
          echo "PROFILE=$PROFILE" >> $GITHUB_ENV
          echo "PACKAGES=$PACKAGES_INPUT" >> $GITHUB_ENV
          echo "CREATE_RELEASE=$CREATE_RELEASE_INPUT" >> $GITHUB_ENV

      - name: Download ImageBuilder
        run: |
          set -e
          IB_NAME="openwrt-imagebuilder-${OPENWRT_VERSION}-${TARGET}-${SUBTARGET}.Linux-x86_64.tar.xz"
          IB_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}/${IB_NAME}"
          echo "Trying to download $IB_URL"
          wget -nv -O ${IB_NAME} ${IB_URL} || (echo "Failed to download ImageBuilder: $IB_URL" && exit 1)
          tar -xJf ${IB_NAME}

      - name: Build image
        working-directory: ./openwrt-imagebuilder-*
        run: |
          set -e
          mkdir -p ../${OUTDIR}
          # PROFILE 必须精确匹配
          make image PROFILE="${PROFILE}" PACKAGES="${PACKAGES}" FILES="../files" || (echo "make image failed" && exit 1)
          cp -v -r bin/targets/*/* ../../${OUTDIR}/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-imagebuilder-${{ env.OPENWRT_VERSION }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ env.PROFILE }}
          path: out

      - name: Create release (optional)
        if: env.CREATE_RELEASE == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_id }}
          name: OpenWrt Build ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
